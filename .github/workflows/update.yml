name: Update Ladybird versions

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: update-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for open vcpkg-drift issue
        id: drift-check
        uses: actions/github-script@v8
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'vcpkg-drift',
              state: 'open',
            });
            const hasLabel = (i, n) => i.labels.some(l => (l.name ?? l) === n);
            const accepted = issues.data.find(i => hasLabel(i, 'drift-accepted'));
            const blocking = issues.data.find(i => !hasLabel(i, 'drift-accepted'));
            if (blocking) {
              core.warning('Open vcpkg-drift issue – blocked until resolved or labelled drift-accepted.');
              core.setOutput('blocked', 'true');
            } else {
              core.setOutput('blocked', 'false');
              if (accepted) core.setOutput('acceptIssue', String(accepted.number));
            }

      - name: Update DB
        if: steps.drift-check.outputs.blocked == 'false'
        uses: actions/github-script@v8
        env:
          ACCEPT_ISSUE: ${{ steps.drift-check.outputs.acceptIssue }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const REPO = { owner: 'LadybirdBrowser', repo: 'ladybird' };
            const MAX_PAGES = 100;

            const rl = (await github.rest.rateLimit.get()).data.resources.core;
            if (rl.remaining < 100) {
              core.notice(
                `API budget low (${rl.remaining} left, resets `
                + `${new Date(rl.reset * 1000).toISOString()}) - skipping run.`,
              );
              return;
            }

            const latestFile = 'latest';
            const lastSha = fs.existsSync(latestFile)
              ? fs.readFileSync(latestFile, 'utf8').trim()
              : null;

            let nixpkgs = null;
            if (lastSha && fs.existsSync(`${lastSha}.toml`)) {
              const prev = fs.readFileSync(`${lastSha}.toml`, 'utf8');
              nixpkgs = prev.match(/^nixpkgs\s*=\s*"([^"]+)"/m)?.[1] ?? null;
            }
            if (!nixpkgs) {
              core.setFailed('No nixpkgs rev found – create initial TOML with nixpkgs set.');
              return;
            }

            const lbenv = (await github.rest.repos.getCommit(
              { owner: 'dragon-slayer875', repo: 'lbenv', ref: 'HEAD' },
            )).data.sha;

            const fresh = [];
            let pages = 0;
            let found = !lastSha;
            outer:
            for await (const page of github.paginate.iterator(
              github.rest.repos.listCommits, { ...REPO, per_page: 100 },
            )) {
              if (++pages > MAX_PAGES) break;
              for (const c of page.data) {
                if (lastSha && c.sha === lastSha) { found = true; break outer; }
                fresh.push({
                  sha: c.sha,
                  date: c.commit.committer.date.slice(0, 10),
                  time: c.commit.committer.date.slice(11, 16),
                  title: c.commit.message.split('\n')[0].replace(/\r/g, ''),
                });
                if (!lastSha) break outer;
              }
            }

            if (!found) {
              core.warning(
                `Last recorded commit ${lastSha} not found in newest `
                + `${MAX_PAGES * 100} commits (history rewritten?); re-anchoring to newest.`,
              );
              const newest = fresh[0];
              fresh.length = 0;
              if (newest) fresh.push(newest);
            }
            fresh.reverse();

            if (!fresh.length) {
              core.info('No new commits');
              return;
            }

            const overridesAt = async (ref) => {
              let f;
              try {
                f = await github.rest.repos.getContent(
                  { ...REPO, path: 'vcpkg.json', ref },
                );
              } catch (e) {
                throw new Error(
                  `Cannot read vcpkg.json at ${ref.slice(0, 8)}: `
                  + `${e.status ?? '?'} ${e.message}`,
                );
              }
              let json;
              try {
                json = JSON.parse(Buffer.from(f.data.content, 'base64').toString());
              } catch (e) {
                throw new Error(`Invalid vcpkg.json at ${ref.slice(0, 8)}: ${e.message}`);
              }
              return {
                remaining: Number(f.headers['x-ratelimit-remaining'] ?? NaN),
                baseline: json['builtin-baseline'] ?? '',
                overrides: Object.fromEntries((json.overrides ?? []).map(p => [p.name, p.version])),
              };
            };

            const hashOverrides = (o) => crypto.createHash('sha256')
              .update(JSON.stringify(Object.entries(o).sort()))
              .digest('hex');

            let prevV = null;
            let prevHash = null;
            if (lastSha && fs.existsSync(`${lastSha}.toml`)) {
              const prevToml = fs.readFileSync(`${lastSha}.toml`, 'utf8');
              prevHash = prevToml.match(/^vcpkg\s*=\s*"([^"]+)"/m)?.[1] ?? null;
              if (prevHash) prevV = await overridesAt(lastSha);
            }

            let lastGoodSha = lastSha;
            let written = 0;

            let aborted = null;

            const acceptIssue = process.env.ACCEPT_ISSUE ? Number(process.env.ACCEPT_ISSUE) : null;
            let driftAccepted = false;

            try {
            for (const c of fresh) {
              const v = await overridesAt(c.sha);
              const currentHash = hashOverrides(v.overrides);

              if (prevHash !== null && (currentHash !== prevHash || v.baseline !== prevV.baseline)) {
                if (acceptIssue && !driftAccepted) {
                  driftAccepted = true;
                  core.notice(`Accepting vcpkg drift at ${c.sha.slice(0, 8)} (issue #${acceptIssue}).`);
                } else {
                const allPkgs = [...new Set([
                  ...Object.keys(prevV.overrides),
                  ...Object.keys(v.overrides),
                ])].sort();
                const rows = allPkgs
                  .filter(p => prevV.overrides[p] !== v.overrides[p])
                  .map(p => `| ${p} | ${prevV.overrides[p] ?? '-'} | ${v.overrides[p] ?? '-'} |`);

                const head = c.sha.slice(0, 8);
                const base = (lastGoodSha ?? '?').slice(0, 8);
                const bodyLines = [
                  '## vcpkg.json changed in Ladybird',
                  '',
                  `\`${base}\` -> \`${head}\``,
                  '',
                ];
                if (prevV.baseline !== v.baseline) {
                  bodyLines.push(
                    `**builtin-baseline**: \`${prevV.baseline || '-'}\` → \`${v.baseline || '-'}\``,
                    '',
                  );
                }
                if (rows.length) {
                  bodyLines.push('| Package | before | now |', '|---|---|---|', ...rows, '');
                }
                bodyLines.push('_Fix the nixpkgs pins in `flake.nix`, then add the `drift-accepted` label to this issue._');

                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `vcpkg drift @ ${head}`,
                  labels: ['vcpkg-drift'],
                  body: bodyLines.join('\n'),
                });
                break;
                }
              }

              const toml = [
                `ladybird = "${c.sha}"`,
                `nixpkgs  = "${nixpkgs}"`,
                `vcpkg    = "${currentHash}"`,
                `baseline = "${v.baseline}"`,
                `date     = "${c.date}"`,
                `time     = "${c.time}"`,
                `title    = "${c.title.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"`,
                `lbenv    = "${lbenv}"`,
              ].join('\n') + '\n';

              fs.writeFileSync(`${c.sha}.toml`, toml);
              lastGoodSha = c.sha;
              prevV = v;
              prevHash = currentHash;
              written++;

              if (Number.isFinite(v.remaining) && v.remaining < 50) {
                core.notice(
                  `API budget low (${v.remaining} left) - stopping after `
                  + `${written} commits, resuming next run.`,
                );
                break;
              }
            }
            } catch (e) {
              aborted = e;
            }

            if (written > 0) {
              fs.writeFileSync(latestFile, lastGoodSha + '\n');
              core.info(`Added ${written} commits`);
            }

            if (driftAccepted && acceptIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: acceptIssue,
                body: 'Drift accepted; DB advanced past the drift commit.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: acceptIssue, state: 'closed', state_reason: 'completed',
              });
            }

            if (aborted) {
              core.setFailed(
                written > 0
                  ? `Stopped after ${written} commits: ${aborted.message}`
                  : aborted.message,
              );
            }

      - name: Commit and push
        # Runs even if "Update DB" failed, so partial progress is committed.
        # Skipped on cancellation and when a drift issue blocks the run.
        if: ${{ !cancelled() && steps.drift-check.outputs.blocked == 'false' }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.toml' latest
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          COUNT=$(git diff --cached --name-only | grep -c '\.toml$' || true)
          git commit -m "db: add $COUNT Ladybird commits ($(date -u +%F))"
          git pull --rebase --autostash
          git push
